<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My NFT Punk Lab</title>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        h1 { color: #58a6ff; font-size: 3rem; }
        p { font-size: 1.2rem; color: #8b949e; }
        .nft-container { margin-top: 30px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .nft-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; width: 200px; }
        .nft-card img { width: 100%; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Welcome to My Punk Lab</h1>
    <p>Discover my unique 2,000 NFT collection generated live on the blockchain!</p>
    
    <div class="nft-container">
        <!-- এখানে আপনার জেনারেট করা NFT ছবিগুলো দেখাতে পারবেন -->
        <div class="nft-card">
            <h3>NFT #1501</h3>
            <p>Status: Minted</p>
        </div>
    </div>
</body>
</html>
