<div class="glass-card p-6 rounded-2xl border-2 border-purple-500 bg-slate-900/60 shadow-xl space-y-4">
  <h3 class="font-raj font-bold text-xl text-purple-400 flex items-center gap-2">
    <i data-lucide="file-json" class="w-5 h-5"></i> NFT Metadata Inspector & Attribute Finder
  </h3>
  
  <div class="border-2 border-dashed border-purple-500/40 hover:border-purple-500 bg-slate-950/60 p-6 rounded-xl text-center transition cursor-pointer relative" id="drop-zone">
    <input type="file" id="metadata-file-input" accept=".json" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
    <div class="space-y-2 pointer-events-none">
      <i data-lucide="upload-cloud" class="w-10 h-10 text-purple-400 mx-auto animate-pulse"></i>
      <p class="text-sm font-medium text-slate-300">Drag & drop your NFT JSON metadata file here, or <span class="text-purple-400 underline font-bold">Browse</span></p>
      <p class="text-xs text-slate-500">Supports standard ERC-721 / 404 Metadata format (.json)</p>
    </div>
  </div>

  <div id="analysis-result-box" class="hidden space-y-4 pt-2">
    <div class="p-4 bg-slate-950 rounded-xl border border-slate-800 flex flex-col md:flex-row justify-between gap-3">
      <div>
        <span class="text-[10px] font-bold tracking-widest text-purple-400 uppercase">NFT Name</span>
        <h4 id="analyst-nft-name" class="font-orb text-lg font-black text-white">-</h4>
      </div>
      <div>
        <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">Total Attributes Found</span>
        <div id="analyst-attr-count" class="font-black text-emerald-400 text-lg md:text-right">0</div>
      </div>
    </div>

    <div>
      <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase block mb-2">Extracted Trait Vectors & Matrix Maps</span>
      <div id="analyst-attributes-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        </div>
    </div>
  </div>
</div>

<script>
  // Script logic specific for parsing JSON Metadata File
  document.addEventListener('DOMContentLoaded', () => {
    const fileInput = document.getElementById('metadata-file-input');
    const dropZone = document.getElementById('drop-zone');
    const resultBox = document.getElementById('analysis-result-box');
    const nameDisplay = document.getElementById('analyst-nft-name');
    const countDisplay = document.getElementById('analyst-attr-count');
    const gridDisplay = document.getElementById('analyst-attributes-grid');

    // Drag and Drop visual helper states
    fileInput.addEventListener('dragover', () => dropZone.classList.add('border-purple-500', 'bg-purple-950/20'));
    fileInput.addEventListener('dragleave', () => dropZone.classList.remove('border-purple-500', 'bg-purple-950/20'));
    fileInput.addEventListener('drop', () => dropZone.classList.remove('border-purple-500', 'bg-purple-950/20'));

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const metadata = JSON.parse(event.target.result);
          processAndShowMetadata(metadata);
        } catch (err) {
          if (typeof App !== 'undefined' && App.showToast) App.showToast('❌ Invalid JSON format architecture!');
          else alert('Invalid JSON structure file.');
        }
      };
      reader.readAsText(file);
    });

    function processAndShowMetadata(json) {
      // Clean previous grid data
      gridDisplay.innerHTML = '';
      
      // Extract Basic Info
      const nftName = json.name || 'Unnamed Artifact';
      const attributes = json.attributes || [];

      nameDisplay.textContent = nftName;
      countDisplay.textContent = `${attributes.length} Layers`;

      if (attributes.length === 0) {
        gridDisplay.innerHTML = `<div class="col-span-full p-4 bg-slate-950/40 text-center text-xs text-slate-500 rounded-xl">No active standard attribute arrays found inside this file structure.</div>`;
      } else {
        // Map and render attributes
        attributes.forEach(attr => {
          const traitType = attr.trait_type || 'Unknown Type';
          const traitValue = attr.value || 'Null Vector';
          
          // Build individual dynamic dynamic cards
          const attrCard = document.createElement('div');
          attrCard.className = 'bg-slate-950 p-3 rounded-xl border border-slate-800 flex flex-col justify-between hover:border-purple-500/50 transition';
          attrCard.innerHTML = `
            <span class="text-[9px] font-bold text-purple-400 uppercase tracking-wider">${escapeHtmlString(traitType)}</span>
            <span class="text-sm font-bold text-slate-100 mt-1">${escapeHtmlString(traitValue)}</span>
          `;
          gridDisplay.appendChild(attrCard);
        });
      }

      // Show result display box layout
      resultBox.classList.remove('hidden');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function escapeHtmlString(str) {
      if(!str) return '';
      return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }
  });
</script>
